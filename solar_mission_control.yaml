            \ Amber Transition (140W - 190W, ~31% - 42%)\n      border_color = 'rgba(255, 167, 38, 0.65)';\n      card_glow\
            \ = '0 0 7px rgba(255, 167, 38, 0.22)';\n      text_glow = 'none';\n      pwr_color = '#ffcc80';\n      bg_solar\
