            \  </div>\n          </div>\n          <div style=\"width: 1px; height: 18px; background: rgba(255,255,255,0.1);\"\
            ></div>\n          <!-- Peak Roof Solar Bus Voltage (from highest microinverter) -->\n          <div style=\"\
            display: flex; align-items: center; gap: 5px;\">\n            <ha-icon icon=\"mdi:solar-power\" style=\"color:\
            \ #ffd54f; --mdc-icon-size: 15px;\"></ha-icon>\n            <div>\n              <div style=\"font-size: 7px;\
            \ color: rgba(255,255,255,0.45); font-weight: 700; text-transform: uppercase;\">Roof Bus Peak</div>\n        \
            \      <div style=\"font-size: 12px; font-weight: 800; color: #ffd54f; line-height: 1.1;\">\n                ${Math.round(solarBusV)}\
            \ <span style=\"font-size: 8px; color: rgba(255,255,255,0.45); font-weight: 600;\">V</span>\n                <span\
            \ style=\"font-size: 7.5px; color: #81c784; font-weight: 700;\">${deltaV ? ' (+' + deltaV + 'V)' : ''}</span>\n\
            \              </div>\n            </div>\n          </div>\n          <div style=\"width: 1px; height: 18px;\
            \ background: rgba(255,255,255,0.1);\"></div>\n          <!-- Grid Frequency -->\n          <div style=\"display:\
            \ flex; align-items: center; gap: 5px;\">\n            <ha-icon icon=\"mdi:sine-wave\" style=\"color: #00e5ff;\
            \ --mdc-icon-size: 15px;\"></ha-icon>\n            <div>\n              <div style=\"font-size: 7px; color: rgba(255,255,255,0.45);\
            \ font-weight: 700; text-transform: uppercase;\">Frequency</div>\n              <div style=\"font-size: 12px;\
            \ font-weight: 800; color: #ffffff; line-height: 1.1;\">${gridFreq} <span style=\"font-size: 8px; color: rgba(255,255,255,0.45);\
            \ font-weight: 600;\">Hz</span></div>\n            </div>\n          </div>\n        </div>\n\n        <!-- Dynamic\
            \ Chromatic Voltage Safety Badge -->\n        <div style=\"background: ${vGuardBg}; border: 1px solid ${vGuardBorder};\
            \ padding: 3px 7px; border-radius: 8px; font-size: 8.5px; font-weight: 800; color: ${vGuardColor}; display: flex;\
            \ align-items: center; gap: 4px; box-shadow: ${vGuardGlow};\">\n          <span style=\"width: 5px; height: 5px;\
            \ border-radius: 50%; background: ${vGuardColor}; box-shadow: 0 0 6px ${vGuardColor};\"></span>\n          ${vGuardText}\n\
            \        </div>\n      </div>\n\n      <!-- RECOMMENDATION B: 8 Micro-Inverter Telemetry Grid with VOLTAGE on\
            \ each tile -->\n      <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;\">\n  `;\n\
            \n  for (const inv of invData) {\n    let tColor = '#81c784';\n    if (typeof inv.temp === 'number') {\n     \
            \ if (inv.temp >= 50) tColor = '#ef5350';\n      else if (inv.temp >= 42) tColor = '#ffa726';\n    }\n\n    //\
            \ Signal Quality Color\n    let sigColor = '#81c784';\n    if (typeof inv.signal === 'number') {\n      if (inv.signal\
            \ < -75) sigColor = '#ffa726';\n      else if (inv.signal < -85) sigColor = '#ef5350';\n    }\n\n    // Voltage\
            \ Warning Color (>248V amber, >252V red)\n    let vColor = '#ffffff';\n    if (typeof inv.voltage === 'number')\
            \ {\n      if (inv.voltage >= 252) vColor = '#ff1744';\n      else if (inv.voltage >= 248) vColor = '#ff9100';\n\
            \    }\n\n    const isDS3H = (inv.model === 'DS3-H');\n\n    output += `\n      <div style=\"background: rgba(255,\
            \ 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px;\
            \ padding: 6px 4px 5px; display: flex; flex-direction: column; align-items: center; text-align: center; cursor:\
            \ pointer; transition: transform 0.15s ease;\"\n           onclick=\"const ev = new CustomEvent('hass-more-info',\
            \ { detail: { entityId: '${inv.tEntity}' }, bubbles: true, composed: true }); this.dispatchEvent(ev);\">\n   \
            \     \n        <!-- Top: Inverter Badge ID & Accurate Model Tag -->\n        <div style=\"width: 100%; display:\
            \ flex; justify-content: space-between; align-items: center; margin-bottom: 2px; padding: 0 1px;\">\n        \
            \  <span style=\"font-size: 8.5px; font-weight: 800; color: #90caf9; font-family: monospace; letter-spacing: -0.2px;\"\
            >\n            ${inv.id}\n          </span>\n          <span style=\"font-size: 7px; font-weight: 800; padding:\
            \ 1px 4px; border-radius: 3px; background: rgba(255, 255, 255, 0.07); color: rgba(255, 255, 255, 0.55); border:\
            \ 1px solid transparent;\">\n            ${inv.model}\n          </span>\n        </div>\n\n        <!-- Middle:\
            \ Temperature & Combined Active Wattage -->\n        <div style=\"display: flex; align-items: center; justify-content:\
            \ center; gap: 4px; margin: 2px 0;\">\n          <div style=\"display: flex; align-items: center; gap: 1.5px;\"\
            >\n            <ha-icon icon=\"mdi:thermometer\" style=\"color: ${tColor}; --mdc-icon-size: 12px;\"></ha-icon>\n\
            \            <span style=\"font-size: 12.5px; font-weight: 800; color: ${tColor}; line-height: 1;\">\n       \
            \       ${inv.temp}\xB0\n            </span>\n          </div>\n          <span style=\"font-size: 8px; color:\
            \ rgba(255,255,255,0.25);\">\u2022</span>\n          <span style=\"font-size: 11px; font-weight: 800; color: #ffd54f;\
            \ line-height: 1; text-shadow: 0 0 6px rgba(255,213,79,0.35);\">\n            ${inv.watts > 0 ? inv.watts + 'W'\
            \ : '0W'}\n          </span>\n        </div>\n\n        <!-- Bottom: Dual Telemetry (Voltage + Zigbee Signal)\
            \ -->\n        <div style=\"width: 100%; display: flex; justify-content: space-between; align-items: center; background:\
            \ rgba(0, 0, 0, 0.45); border-radius: 4px; padding: 1.5px 4px; border: 1px solid rgba(255, 255, 255, 0.05); margin-top:\
            \ 2px; box-sizing: border-box;\">\n          <span style=\"font-size: 7.5px; font-weight: 800; color: ${vColor};\
            \ font-family: monospace;\">\n            ${inv.voltage}V\n          </span>\n          <div style=\"display:\
            \ flex; align-items: center; gap: 1.5px;\">\n            <ha-icon icon=\"mdi:wifi\" style=\"color: ${sigColor};\
            \ --mdc-icon-size: 8px;\"></ha-icon>\n            <span style=\"font-size: 7px; font-weight: 700; color: ${sigColor};\
            \ font-family: monospace;\">\n              ${inv.signal}\n            </span>\n          </div>\n        </div>\n\
            \      </div>\n    `;\n  }\n\n  output += `\n      </div>\n    </div>\n  `;\n  return output;\n]]]"
        tap_action:
