            \ ${pct}%\n          </span>\n        </div>\n\n        <!-- Bottom row: Inverter ID clearly visible in dedicated\
            \ badge -->\n        <div style=\"z-index: 3; width: calc(100% - 2px); text-align: center; background: rgba(0,\
