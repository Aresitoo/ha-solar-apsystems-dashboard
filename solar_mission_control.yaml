            \ 10; overflow: visible;\">\n                <defs>\n                  <filter id=\"shadowBlur\" x=\"-30%\" y=\"\
            -30%\" width=\"160%\" height=\"160%\">\n                    <feGaussianBlur stdDeviation=\"2.8\" />\n        \
            \          </filter>\n                  <linearGradient id=\"volumetricShadowGrad\" x1=\"${bx}\" y1=\"${by}\"\
            \ x2=\"${tx}\" y2=\"${ty}\" gradientUnits=\"userSpaceOnUse\">\n                    <stop offset=\"0%\" stop-color=\"\
            #000000\" stop-opacity=\"0.88\" />\n                    <stop offset=\"50%\" stop-color=\"#0a0505\" stop-opacity=\"\
            0.52\" />\n                    <stop offset=\"100%\" stop-color=\"#000000\" stop-opacity=\"0.0\" />\n        \
            \          </linearGradient>\n                </defs>\n\n                <!-- Soft Feathered Volumetric Shadow\
            \ Cone Fan -->\n                <path d=\"${shadow_cone_path}\" fill=\"url(#volumetricShadowGrad)\" filter=\"\
            url(#shadowBlur)\" />\n              </svg>\n            ` : ''}\n\n            <!-- Clean Uncrossed Chimney Core\
            \ (Fireplace badge & typography) -->\n            <div style=\"width: 24px; height: 24px; border-radius: 6px;\
            \ background: rgba(255, 110, 64, 0.15); display: flex; align-items: center; justify-content: center; border: 1px\
            \ solid rgba(255, 110, 64, 0.45); z-index: 3;\">\n              <ha-icon icon=\"mdi:fireplace\" style=\"color:\
            \ #ff7043; --mdc-icon-size: 15px;\"></ha-icon>\n            </div>\n            <div style=\"font-size: 8px; font-weight:\
            \ 700; color: #ffab91; text-transform: uppercase; margin-top: 3px; letter-spacing: 0.3px; z-index: 3;\">Brick</div>\n\
            \            <div style=\"font-size: 7px; color: rgba(255, 204, 188, 0.85); font-weight: 600; text-align: center;\
            \ margin-top: 1px; z-index: 3;\">Chimney</div>\n          </div>\n  `;\n\n  for (const p of panelList) {\n   \
            \ let p_entity = 'sensor.inverter_' + p.inv + '_power_ch_' + p.ch;\n    let t_entity = 'sensor.inverter_' + p.inv\
