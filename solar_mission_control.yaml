            \ dur=\"1.4s\" repeatCount=\"indefinite\" />\n                  </polygon>\n                  \n             \
            \     <!-- Raindrop 1 -->\n                  <line x1=\"3\" y1=\"11\" x2=\"2\" y2=\"16\" stroke=\"#00e5ff\" stroke-width=\"\
            1.4\" stroke-linecap=\"round\">\n                    <animateTransform attributeName=\"transform\" type=\"translate\"\
            \ values=\"0,0; -1,6; -2,12\" dur=\"0.75s\" repeatCount=\"indefinite\" />\n                    <animate attributeName=\"\
            opacity\" values=\"0; 1; 1; 0\" dur=\"0.75s\" repeatCount=\"indefinite\" />\n                  </line>\n     \
            \             \n                  <!-- Raindrop 2 -->\n                  <line x1=\"16\" y1=\"10.5\" x2=\"15\"\
