            \ attributeName=\"transform\" type=\"translate\" values=\"0,0; -1,6; -2,12\" begin=\"0.3s\" dur=\"0.8s\" repeatCount=\"\
            indefinite\" />\n                    <animate attributeName=\"opacity\" values=\"0; 1; 1; 0\" begin=\"0.3s\" dur=\"\
            0.8s\" repeatCount=\"indefinite\" />\n                  </line>\n                </g>\n              ` : ''}\n\
            \            </g>\n          </svg>\n        ` : ''}\n\n        <!-- Solar Grid (6 columns x 4 rows) -->\n   \
            \     <div style=\"display: grid; pointer-events: auto !important; grid-template-columns: repeat(6, 1fr); grid-template-rows:\
            \ repeat(4, auto); gap: 5px; width: 100%; position: relative;\">\n          \n          <!-- Row 2, Col 2: Architectural\
            \ Brick Chimney Obstruction with Pure Volumetric Shadow Cone -->\n          <div style=\"grid-column: 2; grid-row:\
            \ 2; background: linear-gradient(145deg, #171c26 0%, #1e2430 100%); border: 1px solid rgba(255, 110, 64, 0.45);\
            \ border-radius: 7px; padding: 4px; display: flex; flex-direction: column; justify-content: center; align-items:\
            \ center; min-height: 74px; position: relative; overflow: visible; box-sizing: border-box; box-shadow: ${chimney_shadow};\
            \ transition: box-shadow 0.3s ease;\">\n            \n            <!-- Pure Volumetric Soft Shadow Cone Projection\
            \ (No red wire/dot) -->\n            ${shadow_active ? `\n              <svg style=\"position: absolute; width:\
