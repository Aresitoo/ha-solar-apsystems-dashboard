            \ else if (p_state >= 70) {\n      // Tier 2: Partial Shade / Morning Wake (70W - 140W, ~15% - 31%) -> Electric\
            \ Cyan/Blue\n      border_color = 'rgba(0, 229, 255, 0.65)';\n      card_glow = '0 0 10px rgba(0, 229, 255, 0.35),\
            \ inset 0 0 6px rgba(0, 229, 255, 0.15)';\n      text_glow = '0 0 8px rgba(0, 229, 255, 0.5)';\n      pwr_color\
            \ = '#00e5ff';\n      bg_solar = 'linear-gradient(180deg, #0e1a24 0%, #122433 100%)';\n      cell_line_color =\
            \ 'rgba(0, 229, 255, 0.22)';\n      fill_grad = 'linear-gradient(0deg, rgba(0, 229, 255, 0.3) 0%, rgba(0, 229,\
            \ 255, 0.08) 100%)';\n    } else {\n      // Tier 1: Deep Shade / Low Nocturnal (< 70W, < 15%)\n      border_color\
            \ = 'rgba(0, 229, 255, 0.3)';\n      card_glow = 'none';\n      text_glow = 'none';\n      pwr_color = '#80d8ff';\n\
            \      bg_solar = 'linear-gradient(180deg, #0c141d 0%, #101c27 100%)';\n      cell_line_color = 'rgba(0, 229,\
