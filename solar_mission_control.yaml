            \ panel is shaded) -->\n        ${is_shaded ? `\n          <div style=\"position: absolute; inset: 0; pointer-events:\
            \ none; z-index: 2; opacity: 0.45; background-image: repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.6) 0px,\
