            \ text_glow, pwr_color, bg_solar, cell_line_color, fill_grad;\n\n    if (p_state >= 320) {\n      // Tier 6: Peak\
            \ Solar Flare (> 320W, > 71%)\n      border_color = 'rgba(255, 87, 34, 0.95)';\n      card_glow = '0 0 16px rgba(255,\
