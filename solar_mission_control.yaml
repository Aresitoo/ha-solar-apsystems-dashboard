            \ shadow:\n    // Only evaluate shade when sun is sufficiently high (elevation >= 16 deg) and array is generating\
            \ (max_panel_watt >= 140W)\n    let is_shaded = false;\n    let shade_reason = 'Shade';\n    if (sun_elevation\
