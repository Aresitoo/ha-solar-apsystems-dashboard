            \ 14px);\"></div>\n\n        <!-- Dynamic Solar Power Level Fill (Calibrated to 450W with glowing waterline) -->\n\
            \        <div style=\"position: absolute; bottom: 0; left: 0; right: 0; height: ${pct}%; background: ${fill_grad};\
            \ border-top: 1.5px solid ${border_color}; box-shadow: 0 0 8px ${border_color}; pointer-events: none; transition:\
