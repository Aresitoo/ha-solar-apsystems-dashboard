            \ border-box; transition: transform 0.1s ease, box-shadow 0.2s ease;\">\n        \n        <!-- Photovoltaic Wafer\
            \ Grid Pattern -->\n        <div style=\"position: absolute; inset: 0; pointer-events: none; opacity: 0.18; background-image:\
            \ repeating-linear-gradient(0deg, transparent, transparent 11px, ${cell_line_color} 11px, ${cell_line_color} 12px),\
