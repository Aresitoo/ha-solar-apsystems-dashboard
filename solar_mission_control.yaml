            \     </div>\n        <div style=\"display: flex; align-items: center; gap: 5px;\">\n          <ha-icon icon=\"\
            mdi:weather-sunny\" style=\"color: #ffb74d; --mdc-icon-size: 14px;\"></ha-icon>\n          <span>Today's Peak:\
            \ <b style=\"color: #ffb74d;\">${todayPeakKw} kW</b></span>\n        </div>\n      </div>\n\n      <!-- 2. Dual\
            \ Financial Ribbon: Gross Solar Value & Net Daily Balance -->\n      <div style=\"display: grid; grid-template-columns:\
            \ 1fr 1fr; gap: 7px; padding-top: 7px;\">\n        <!-- Left Tile: Gross Solar Value -->\n        <div style=\"\
            background: rgba(0, 230, 118, 0.05); border: 1px solid rgba(0, 230, 118, 0.22); border-radius: 10px; padding:\
            \ 7px 9px; display: flex; flex-direction: column; gap: 3px;\">\n          <div style=\"display: flex; justify-content:\
            \ space-between; align-items: baseline;\">\n            <div style=\"display: flex; align-items: center; gap:\
            \ 5px; font-size: 8px; font-weight: 700; color: rgba(255, 255, 255, 0.65); text-transform: uppercase;\">\n   \
            \           <ha-icon icon=\"mdi:solar-power\" style=\"color: #00e676; --mdc-icon-size: 13px;\"></ha-icon>\n  \
            \            <span>Gross Solar Value</span>\n            </div>\n            <div style=\"font-size: 13px; font-weight:\
            \ 800; color: #00e676; line-height: 1;\">${grossSolarStr}</div>\n          </div>\n          <div style=\"font-size:\
            \ 7.5px; color: rgba(255, 255, 255, 0.45); text-align: left; padding-left: 18px;\">Self-consumption savings +\
            \ export</div>\n        </div>\n\n        <!-- Right Tile: Net Daily Balance -->\n        <div style=\"background:\
            \ ${isNetPositive ? 'rgba(0, 229, 255, 0.05)' : 'rgba(255, 183, 77, 0.05)'}; border: 1px solid ${isNetPositive\
            \ ? 'rgba(0, 229, 255, 0.25)' : 'rgba(255, 183, 77, 0.25)'}; border-radius: 10px; padding: 7px 9px; display: flex;\
            \ flex-direction: column; gap: 3px;\">\n          <div style=\"display: flex; justify-content: space-between;\
            \ align-items: baseline;\">\n            <div style=\"display: flex; align-items: center; gap: 5px; font-size:\
            \ 8px; font-weight: 700; color: rgba(255, 255, 255, 0.65); text-transform: uppercase;\">\n              <ha-icon\
            \ icon=\"mdi:scale-balance\" style=\"color: ${isNetPositive ? '#00e5ff' : '#ffb74d'}; --mdc-icon-size: 13px;\"\
            ></ha-icon>\n              <span>Net Daily Balance</span>\n            </div>\n            <div style=\"font-size:\
            \ 13px; font-weight: 800; color: ${isNetPositive ? '#00e5ff' : '#ffb74d'}; line-height: 1;\">${netBalanceStr}</div>\n\
            \          </div>\n          <div style=\"font-size: 7.5px; color: ${isNetPositive ? '#00e5ff' : '#ffb74d'}; font-weight:\
            \ 600; text-align: left; padding-left: 18px;\">${isNetPositive ? 'Net Zero / Credit today' : 'After total household\
            \ draw'}</div>\n        </div>\n      </div>\n    </div>\n  `;\n  return output;\n]]]"
