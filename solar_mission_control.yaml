            \ gap: 6px; margin-top: 5px; padding-left: 2px;\">\n        <div style=\"width: 32%; height: 3px; border-radius:\
            \ 2px; background: linear-gradient(90deg, rgba(255, 82, 82, 0.75) 0%, rgba(255, 82, 82, 0.25) 100%);\"></div>\n\
            \        <span style=\"font-size: 7.5px; color: rgba(255, 255, 255, 0.5); font-weight: 600; letter-spacing: 0.3px;\"\
            >Raised Wall</span>\n      </div>\n\n\n    </div>\n  `;\n  return output;\n]]]"
      - type: custom:button-card
        show_name: false
        show_state: false
        show_icon: false
        triggers_update:
          - sensor.solcast_pv_forecast_forecast_today
          - sensor.solcast_pv_forecast_forecast_tomorrow
