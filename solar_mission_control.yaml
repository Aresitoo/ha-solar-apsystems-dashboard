      - type: custom:button-card
        show_name: false
        show_state: false
        show_icon: false
        triggers_update:
          - sensor.ecu_215000000001_lifetime_energy
          - sensor.ecu_215000000001_lifetime_maximum_power
          - sensor.solar_daily_yield
          - sensor.precio_kwh
          - sensor.co2_intensity
          - sensor.solar_daily_peak_power
        styles:
          card:
            - background: 'linear-gradient(145deg, #11141a 0%, #1a1e26 100%)'
            - border-radius: 20px
            - border: 1px solid rgba(0, 230, 118, 0.25)
            - box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5)
            - padding: 0px
            - pointer-events: auto !important
          grid:
            - grid-template-areas: '"life"'
            - grid-template-columns: 1fr
            - padding: 0px
          custom_fields:
            life:
              - width: 100%
              - white-space: normal
              - overflow: visible
        custom_fields:
          life: "[[[\n  // 1. Live ECU Energy & Peak Power Records\n  const ecuLifeEnt = states['sensor.ecu_215000000001_lifetime_energy'];\n\
            \  const ecuMaxEnt = states['sensor.ecu_215000000001_lifetime_maximum_power'];\n  const dailyYieldEnt = states['sensor.solar_daily_yield'];\n\
            \  const todayPeakEnt = states['sensor.solar_daily_peak_power'] || states['sensor.solar_daily_peak_power'];\n\
            \  const dailyImportEnt = states['sensor.grid_daily_import_energy'] || states['sensor.grid_daily_import_energy'];\n\
            \  const dailyExportEnt = states['sensor.grid_daily_export_energy'];\n  \n  // 2. Stable 24h Average Electricity\
            \ Tariff (Prevents lifetime valuation swinging between Valle/Llano/Punta)\n  const tariffEnt = states['sensor.precio_kwh'];\n\
            \  const tAttrs = tariffEnt ? (tariffEnt.attributes || {}) : {};\n  let spotTariff = (tariffEnt && !isNaN(parseFloat(tariffEnt.state)))\
            \ ? parseFloat(tariffEnt.state) : 0.104;\n\n  let avgTariff = 0.118;\n  const hourlyPrices = [];\n  for (let i\
            \ = 0; i < 24; i++) {\n    const key = 'price_' + (i < 10 ? '0' + i : i) + 'h';\n    if (tAttrs[key] !== undefined\
            \ && !isNaN(parseFloat(tAttrs[key]))) {\n      hourlyPrices.push(parseFloat(tAttrs[key]));\n    }\n  }\n  if (hourlyPrices.length\
            \ > 0) {\n    avgTariff = hourlyPrices.reduce((a, b) => a + b, 0) / hourlyPrices.length;\n  } else if (tAttrs.min_price\
            \ && tAttrs.max_price) {\n    avgTariff = (parseFloat(tAttrs.min_price) + parseFloat(tAttrs.max_price)) / 2;\n\
            \  }\n\n  // 3. Dynamic Values\n  let lifeKwh = (ecuLifeEnt && !isNaN(parseFloat(ecuLifeEnt.state))) ? parseFloat(ecuLifeEnt.state)\
            \ : 34805.6;\n  let maxW = (ecuMaxEnt && !isNaN(parseFloat(ecuMaxEnt.state))) ? parseFloat(ecuMaxEnt.state) :\
            \ 7080;\n  let todayKwh = (dailyYieldEnt && !isNaN(parseFloat(dailyYieldEnt.state))) ? parseFloat(dailyYieldEnt.state)\
            \ : 0.44;\n\n  let lifeMwh = (lifeKwh / 1000).toFixed(2);\n  let lifeValEur = Math.round(lifeKwh * avgTariff).toLocaleString('es-ES')\
            \ + ' \u20AC';\n  let maxKw = (maxW / 1000).toFixed(2);\n  let todayPeakW = (todayPeakEnt && !isNaN(parseFloat(todayPeakEnt.state)))\
            \ ? parseFloat(todayPeakEnt.state) : 0;\n  let todayPeakKw = (todayPeakW / 1000).toFixed(2);\n\n  // Dual Financial\
            \ Metrics: Gross Solar Value & Net Daily Balance\n  let todayImportKwh = (dailyImportEnt && !isNaN(parseFloat(dailyImportEnt.state)))\
            \ ? parseFloat(dailyImportEnt.state) : 0;\n  let todayExportKwh = (dailyExportEnt && !isNaN(parseFloat(dailyExportEnt.state)))\
            \ ? parseFloat(dailyExportEnt.state) : 0;\n  const exportRate = 0.0726; // Contracted Fixed Export Compensation\
            \ Rate (\u20AC/kWh)\n\n  let selfConsumedKwh = Math.max(0, todayKwh - todayExportKwh);\n  let selfConsumedVal\
            \ = selfConsumedKwh * spotTariff;\n  let exportCompensationVal = todayExportKwh * exportRate;\n\n  // 1. Gross\
            \ Solar Value: Avoided retail grid cost plus export compensation credits\n  let grossSolarVal = todayExportKwh\
            \ > 0 ? (selfConsumedVal + exportCompensationVal) : (todayKwh * spotTariff);\n  let grossSolarStr = grossSolarVal.toFixed(2).replace('.',\
            \ ',') + ' \u20AC';\n\n  // 2. Net Daily Balance: Export credits minus cost of energy imported from the grid\n\
            \  let gridImportCost = todayImportKwh * spotTariff;\n  let netBalanceVal = exportCompensationVal - gridImportCost;\n\
            \  let isNetPositive = netBalanceVal >= 0;\n  let netBalanceStr = (isNetPositive ? '+' : '') + netBalanceVal.toFixed(2).replace('.',\
            \ ',') + ' \u20AC';\n\n  // Dynamic Environmental Offset:\n  // APsystems Standard calculation factor (~0.998\
            \ kg CO2/kWh -> 34.8 MWh = 34.76 t CO2)\n  let co2Tons = ((lifeKwh * 0.998) / 1000).toFixed(2);\n  // Equivalent\
            \ Trees Planted (~1 tree per 27 kWh)\n  let treesCount = Math.round(lifeKwh * 0.037).toLocaleString();\n\n  let\
            \ output = `\n    <div style=\"position: relative; pointer-events: auto !important; padding: 16px 12px 14px; box-sizing:\
            \ border-box; width: 100%; border-radius: 20px; overflow: hidden; background: radial-gradient(circle at 50% 0%,\
            \ rgba(0, 230, 118, 0.12) 0%, rgba(14, 17, 24, 0.98) 55%);\">\n      \n      <!-- Top Header: Title & Total Generation\
            \ Badge -->\n      <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom:\
            \ 14px; padding: 0 2px;\">\n        <div style=\"display: flex; align-items: center; gap: 9px;\">\n          <div\
            \ style=\"width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, rgba(0, 230, 118,\
            \ 0.25) 0%, rgba(0, 180, 136, 0.2) 100%); display: flex; align-items: center; justify-content: center; border:\
            \ 1px solid rgba(0, 230, 118, 0.4); box-shadow: 0 0 12px rgba(0, 230, 118, 0.3);\">\n            <ha-icon icon=\"\
            mdi:solar-power\" style=\"color: #00e676; --mdc-icon-size: 21px;\"></ha-icon>\n          </div>\n          <div\
            \ style=\"display: flex; flex-direction: column; align-items: flex-start;\">\n            <div style=\"font-size:\
            \ 16px; font-weight: 800; color: #ffffff; letter-spacing: 0.2px; line-height: 1.1;\">Lifetime Impact & Economy</div>\n\
            \            <div style=\"font-size: 9.5px; color: rgba(255, 255, 255, 0.55); font-weight: 600; margin-top: 2px;\"\
            >APsystems Generation Benefits</div>\n          </div>\n        </div>\n        \n      </div>\n\n      <!-- 4\
            \ Frosted Glass Stat Tiles -->\n      <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap:\
            \ 6px; margin-bottom: 10px;\">\n        \n        <!-- Tile 1: Lifetime Solar Energy -->\n        <div style=\"\
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(14px); border: 1px solid rgba(255, 179, 0, 0.25);\
            \ border-radius: 12px; padding: 10px 8px; display: flex; align-items: center; gap: 10px;\">\n          <div style=\"\
            width: 32px; height: 32px; border-radius: 8px; background: rgba(255, 179, 0, 0.15); display: flex; align-items:\
            \ center; justify-content: center; flex-shrink: 0; border: 1px solid rgba(255, 179, 0, 0.3);\">\n            <ha-icon\
            \ icon=\"mdi:lightning-bolt\" style=\"color: #ffd54f; --mdc-icon-size: 18px;\"></ha-icon>\n          </div>\n\
            \          <div>\n            <div style=\"font-size: 8px; font-weight: 700; color: rgba(255, 255, 255, 0.5);\
            \ text-transform: uppercase;\">Total Produced</div>\n            <div style=\"font-size: 16px; font-weight: 800;\
            \ color: #ffd54f; line-height: 1.1;\">${lifeMwh} MWh</div>\n            \n          </div>\n        </div>\n\n\
            \        <!-- Tile 2: Estimated Energy Value (Dynamic live tariff) -->\n        <div style=\"background: rgba(255,\
            \ 255, 255, 0.03); backdrop-filter: blur(14px); border: 1px solid rgba(0, 230, 118, 0.25); border-radius: 12px;\
            \ padding: 10px 8px; display: flex; align-items: center; gap: 10px;\">\n          <div style=\"width: 32px; height:\
            \ 32px; border-radius: 8px; background: rgba(0, 230, 118, 0.15); display: flex; align-items: center; justify-content:\
            \ center; flex-shrink: 0; border: 1px solid rgba(0, 230, 118, 0.3);\">\n            <ha-icon icon=\"mdi:currency-eur\"\
            \ style=\"color: #00e676; --mdc-icon-size: 18px;\"></ha-icon>\n          </div>\n          <div>\n           \
            \ <div style=\"font-size: 8px; font-weight: 700; color: rgba(255, 255, 255, 0.5); text-transform: uppercase;\"\
            >Solar Value</div>\n            <div style=\"font-size: 16px; font-weight: 800; color: #00e676; line-height: 1.1;\"\
            >${lifeValEur}</div>\n            <div style=\"font-size: 7.5px; color: rgba(255, 255, 255, 0.4); margin-top:\
            \ 1px;\">@ ${avgTariff.toFixed(3)} \u20AC/kWh avg tariff</div>\n          </div>\n        </div>\n\n        <!--\
            \ Tile 3: CO2 Avoided -->\n        <div style=\"background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(14px);\
            \ border: 1px solid rgba(0, 229, 255, 0.25); border-radius: 12px; padding: 10px 8px; display: flex; align-items:\
            \ center; gap: 10px;\">\n          <div style=\"width: 32px; height: 32px; border-radius: 8px; background: rgba(0,\
            \ 229, 255, 0.15); display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid\
            \ rgba(0, 229, 255, 0.3);\">\n            <ha-icon icon=\"mdi:leaf\" style=\"color: #00e5ff; --mdc-icon-size:\
            \ 18px;\"></ha-icon>\n          </div>\n          <div>\n            <div style=\"font-size: 8px; font-weight:\
            \ 700; color: rgba(255, 255, 255, 0.5); text-transform: uppercase;\">CO\u2082 Reduction</div>\n            <div\
            \ style=\"font-size: 16px; font-weight: 800; color: #00e5ff; line-height: 1.1;\">${co2Tons} t</div>\n        \
            \    <div style=\"font-size: 7.5px; color: rgba(255, 255, 255, 0.4); margin-top: 1px;\">Carbon offset achieved</div>\n\
            \          </div>\n        </div>\n\n        <!-- Tile 4: Tree Reforestation Equivalent -->\n        <div style=\"\
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(14px); border: 1px solid rgba(129, 199, 132, 0.25);\
            \ border-radius: 12px; padding: 10px 8px; display: flex; align-items: center; gap: 10px;\">\n          <div style=\"\
            width: 32px; height: 32px; border-radius: 8px; background: rgba(129, 199, 132, 0.15); display: flex; align-items:\
            \ center; justify-content: center; flex-shrink: 0; border: 1px solid rgba(129, 199, 132, 0.3);\">\n          \
            \  <ha-icon icon=\"mdi:tree\" style=\"color: #81c784; --mdc-icon-size: 18px;\"></ha-icon>\n          </div>\n\
            \          <div>\n            <div style=\"font-size: 8px; font-weight: 700; color: rgba(255, 255, 255, 0.5);\
            \ text-transform: uppercase;\">Trees Planted</div>\n            <div style=\"font-size: 16px; font-weight: 800;\
            \ color: #81c784; line-height: 1.1;\">${treesCount}</div>\n            <div style=\"font-size: 7.5px; color: rgba(255,\
            \ 255, 255, 0.4); margin-top: 1px;\">Forest absorption equiv.</div>\n          </div>\n        </div>\n      </div>\n\
            \n      <!-- 1. All-Time Peak & Today's Peak Row -->\n      <div style=\"display: flex; justify-content: space-between;\
            \ align-items: center; padding: 4px 6px 7px; font-size: 9.5px; color: rgba(255, 255, 255, 0.65); font-weight:\
            \ 600; border-bottom: 1px solid rgba(255, 255, 255, 0.07);\">\n        <div style=\"display: flex; align-items:\
