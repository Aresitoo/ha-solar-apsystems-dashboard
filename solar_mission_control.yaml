            \ shadow to NW/NNW onto Row 2 Col 2/3 and Row 3 Col 2/3\n        if ((p.row === 2 && (p.col === 2 || p.col ===\
            \ 3)) || (p.row === 3 && (p.col === 2 || p.col === 3))) {\n          if (p_state <= max_panel_watt * 0.45 && p_state\
