              - width: 100%
              - white-space: normal
              - overflow: visible
        custom_fields:
          solcast: "[[[\n  const days = [\n    { key: 'today', label: 'TODAY', d_offset: 0 },\n    { key: 'tomorrow', label:\
            \ 'TOMORROW', d_offset: 1 },\n    { key: 'day_3', label: 'DAY 3', d_offset: 2 },\n    { key: 'day_4', label: 'DAY\
            \ 4', d_offset: 3 },\n    { key: 'day_5', label: 'DAY 5', d_offset: 4 },\n    { key: 'day_6', label: 'DAY 6',\
            \ d_offset: 5 },\n    { key: 'day_7', label: 'DAY 7', d_offset: 6 }\n  ];\n\n  const weekdayNames = ['SUN', 'MON',\
            \ 'TUE', 'WED', 'THU', 'FRI', 'SAT'];\n  const todayDate = new Date();\n\n  let forecastData = [];\n  let maxKwh\
            \ = 1;\n  let totalWeekKwh = 0;\n\n  for (let i = 0; i < days.length; i++) {\n    const item = days[i];\n    const\
            \ ent = states['sensor.solcast_pv_forecast_forecast_' + item.key];\n    let val = ent ? parseFloat(ent.state)\
            \ : 0;\n    if (isNaN(val)) val = 0;\n    \n    let d = new Date(todayDate);\n    d.setDate(todayDate.getDate()\
            \ + item.d_offset);\n    let dayName = (i === 0) ? 'TODAY' : weekdayNames[d.getDay()];\n\n    forecastData.push({\n\
            \      key: item.key,\n      label: dayName,\n      kwh: val,\n      dateStr: d.getDate() + '/' + (d.getMonth()\
            \ + 1)\n    });\n\n    if (val > maxKwh) maxKwh = val;\n    totalWeekKwh += val;\n  }\n\n  // Daily Actual Yield\
            \ (Shelly EM)\n  const yieldEnt = states['sensor.solar_daily_yield'];\n  let yieldRaw = yieldEnt ? parseFloat(yieldEnt.state)\
            \ : 0;\n  if (isNaN(yieldRaw)) yieldRaw = 0;\n\n  // Intraday Metrics\n  const remEnt = states['sensor.solcast_pv_forecast_forecast_remaining_today'];\n\
            \  const thisHourEnt = states['sensor.solcast_pv_forecast_forecast_this_hour'];\n  const nextHourEnt = states['sensor.solcast_pv_forecast_forecast_next_hour'];\n\
            \  const peakForecastEnt = states['sensor.solcast_pv_forecast_peak_forecast_today'];\n  const peakTimeEnt = states['sensor.solcast_pv_forecast_peak_time_today'];\n\
            \n  let remKwh = remEnt ? parseFloat(remEnt.state).toFixed(1) : '0.0';\n  let thisHourRaw = thisHourEnt ? parseFloat(thisHourEnt.state)\
            \ : 0;\n  let nextHourRaw = nextHourEnt ? parseFloat(nextHourEnt.state) : 0;\n  let thisHourKwh = (thisHourRaw\
            \ / 1000).toFixed(2);\n  let nextHourKwh = (nextHourRaw / 1000).toFixed(2);\n  let peakW = peakForecastEnt ? parseFloat(peakForecastEnt.state)\
            \ : 0;\n  let peakStr = peakW >= 1000 ? (peakW / 1000).toFixed(1) + ' kW' : Math.round(peakW) + ' W';\n\n  let\
            \ peakTimeStr = '14:00';\n  if (peakTimeEnt && peakTimeEnt.state) {\n    try {\n      let pt = new Date(peakTimeEnt.state);\n\
            \      if (!isNaN(pt.getTime())) {\n        peakTimeStr = String(pt.getHours()).padStart(2, '0') + ':' + String(pt.getMinutes()).padStart(2,\
            \ '0');\n      }\n    } catch(e) {}\n  }\n\n  // Find best day\n  let bestDay = forecastData.reduce((prev, curr)\
            \ => (curr.kwh > prev.kwh) ? curr : prev, forecastData[0]);\n\n  let output = `\n    <div style=\"position: relative;\
            \ pointer-events: auto !important; padding: 16px 12px 14px; box-sizing: border-box; width: 100%; border-radius:\
            \ 20px; overflow: hidden; background: radial-gradient(circle at 50% 0%, rgba(255, 179, 0, 0.12) 0%, rgba(14, 17,\
            \ 24, 0.98) 55%);\">\n      \n      <!-- Top Header: Title & Forecast Peak Badge -->\n      <div style=\"display:\
            \ flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding: 0 2px;\">\n       \
            \ <div style=\"display: flex; align-items: center; gap: 9px;\">\n          <div style=\"width: 34px; height: 34px;\
            \ border-radius: 10px; background: linear-gradient(135deg, rgba(255, 179, 0, 0.25) 0%, rgba(255, 112, 67, 0.2)\
            \ 100%); display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255, 179, 0, 0.4);\
            \ box-shadow: 0 0 12px rgba(255, 179, 0, 0.3);\">\n            <ha-icon icon=\"mdi:chart-bell-curve-cumulative\"\
            \ style=\"color: #ffd54f; --mdc-icon-size: 21px;\"></ha-icon>\n          </div>\n          <div style=\"display:\
            \ flex; flex-direction: column; align-items: flex-start;\">\n            <div style=\"font-size: 16px; font-weight:\
            \ 800; color: #ffffff; letter-spacing: 0.2px; line-height: 1.1;\">Solcast 7-Day Outlook</div>\n            <div\
            \ style=\"font-size: 9.5px; color: rgba(255, 255, 255, 0.55); font-weight: 600; margin-top: 2px;\">PV Forecast\
            \ Model & Confidence</div>\n          </div>\n        </div>\n        <div style=\"background: rgba(255, 179,\
            \ 0, 0.12); border: 1px solid rgba(255, 179, 0, 0.35); padding: 3px 9px; border-radius: 12px; font-size: 10.5px;\
            \ font-weight: 700; color: #ffb74d; display: flex; align-items: center; gap: 5px; box-shadow: 0 0 10px rgba(255,\
            \ 179, 0, 0.2);\">\n          <span style=\"font-size: 11px;\">\u26A1</span> Peak ${peakStr} @ ${peakTimeStr}\n\
            \        </div>\n      </div>\n\n      <!-- 3 Sleek Intraday Telemetry Tiles -->\n      <div style=\"display:\
            \ grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px;\">\n        <!-- This Hour -->\n\
