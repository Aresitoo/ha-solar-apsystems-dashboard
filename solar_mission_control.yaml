            \    if (isNaN(p_state)) p_state = 0;\n    let t_state = states[t_entity] ? Math.round(parseFloat(states[t_entity].state))\
            \ : '--';\n    if (isNaN(t_state)) t_state = '--';\n\n    // Calibrated to 450W module rating\n    let pct = Math.min(100,\
