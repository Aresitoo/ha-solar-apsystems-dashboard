            \ rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 7px 11px;\
            \ margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;\">\n        <div style=\"\
            display: flex; align-items: center; gap: 10px;\">\n          <!-- House Grid Voltage (Panel) -->\n          <div\
            \ style=\"display: flex; align-items: center; gap: 5px; cursor: pointer;\"\n               onclick=\"const ev\
            \ = new CustomEvent('hass-more-info', { detail: { entityId: 'sensor.grid_voltage' }, bubbles:\
